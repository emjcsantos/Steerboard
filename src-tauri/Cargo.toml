[package]
name = "steerboard"
version = "0.1.0"
description = "A local-first cockpit for agent-assisted project execution"
authors = ["Steerboard contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "steerboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
